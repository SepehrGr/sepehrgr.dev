name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  image:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/sepehrgr/sepehrgr.dev:sha-${{ github.sha }}
            ghcr.io/sepehrgr/sepehrgr.dev:latest
          labels: |
            org.opencontainers.image.source=https://github.com/SepehrGr/sepehrgr.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: image
    if: github.event_name == 'push' # only after a merge to main, never on PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://sepehrgr.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never interrupt a deploy halfway
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          EXPECTED_FP: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fetch the server's host key and accept it only if its fingerprint matches the pinned one
          ssh-keyscan -p "$PORT" -t ed25519 "$HOST" > /tmp/scanned_key 2>/dev/null || true
          ACTUAL_FP="$(ssh-keygen -lf /tmp/scanned_key 2>/dev/null | awk '{print $2}' || true)"
          echo "Expected host key: $EXPECTED_FP"
          echo "Actual host key:   ${ACTUAL_FP:-<none: could not reach server>}"
          if [ -z "$ACTUAL_FP" ] || [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::Server host key does not match the pinned fingerprint. Refusing to deploy."
            exit 1
          fi
          mv /tmp/scanned_key ~/.ssh/known_hosts
